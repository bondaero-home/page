# 본대로홈 콘텐츠 관리(Sveltia CMS) 설정
# 사장님이 /admin 에서 브라우저로 블로그 글을 작성 → GitHub 커밋 → Cloudflare 자동 재배포.

backend:
  name: github
  repo: seon-biz/bondearo
  branch: main
  # TODO(인증 장치 설치 시): GitHub OAuth 연동 후 아래 값을 채울 것.
  # base_url: https://인증-워커-주소   # 예: Cloudflare Worker(sveltia-cms-auth) 배포 URL
  # auth_endpoint: auth               # base_url 기준 인증 경로 (기본값 auth)

# 사장님이 한글/공백 파일명으로 이미지를 올려도 영문 슬러그 파일명으로 자동 변환
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

# 미디어(이미지) 저장 위치 — 블로그 글이 참조하는 폴더
# (전역 public_folder 는 절대 경로만 허용. 실제 글에서는 아래 컬렉션의 ./images 상대 경로가 쓰인다)
media_folder: src/content/blog/images
public_folder: /images

collections:
  - name: blog
    label: 블로그 글
    label_singular: 블로그 글
    description: 청주 오창·오송 커튼·블라인드 시공 사례와 가이드
    folder: src/content/blog
    create: true
    # 글 1편 = 폴더 1개: src/content/blog/{slug}/index.md + 같은 폴더의 images/
    slug: '{{fields.slug}}'
    path: '{{fields.slug}}/index'
    extension: md
    format: frontmatter
    # 글 폴더 안 images/ 에 사진 저장 (본문에서는 ./images/파일명 으로 참조)
    media_folder: images
    public_folder: ./images
    fields:
      - { name: slug, label: 'URL 주소 (영문 소문자-하이픈)', widget: string, hint: '예: ochang-vertical-blind-privacy · 한글/공백 금지' }
      - { name: title, label: 제목, widget: string }
      - { name: description, label: 요약(검색 노출용 2~3줄), widget: text }
      - { name: pubDate, label: 발행일, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - { name: category, label: 카테고리, widget: select, options: ['시공사례', '가이드'], default: '시공사례' }
      - { name: location, label: 지역, widget: string, hint: '예: 청주 오창 양청리' }
      - { name: buildingType, label: 건물 유형, widget: string, hint: '예: 빌라 원룸' }
      - { name: area, label: 면적, widget: string, hint: '예: 10평' }
      - { name: product, label: 제품, widget: string, hint: '예: 화이트 버티컬블라인드' }
      - { name: cost, label: 시공 비용, widget: string, hint: '예: 20만 원대' }
      - { name: installTime, label: 설치 시간, widget: string, hint: '예: 약 1시간' }
      - { name: leadTime, label: 제작 기간, widget: string, hint: '예: 주문 후 제작 3일' }
      - { name: tags, label: 태그, widget: list, default: [], hint: '검색 키워드. 예: 오창블라인드, 버티컬블라인드' }
      - { name: heroImage, label: 대표 이미지, widget: image, choose_url: false }
      - { name: heroImageAlt, label: '대표 이미지 설명(alt · 지역+공간+제품+장면)', widget: string }
      - name: faq
        label: 자주 묻는 질문 (3개 권장)
        widget: list
        label_singular: 질문
        summary: '{{fields.q}}'
        fields:
          - { name: q, label: 질문, widget: string }
          - { name: a, label: 답변, widget: text }
      - { name: draft, label: 임시저장(공개 안 함), widget: boolean, default: false }
      - { name: body, label: 본문, widget: markdown }
